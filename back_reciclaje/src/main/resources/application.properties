# Aplicacion
spring.application.name=reciclaje

# Conexion a Neon PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Inicializacion de esquemas
app.database.initialize-support-schema=${APP_INITIALIZE_SUPPORT_SCHEMA:true}

# Puerto
server.port=${PORT:8080}

# Sesiones
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador inicial
app.bootstrap-admin.identifier=${BOOTSTRAP_ADMIN_IDENTIFIER:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}