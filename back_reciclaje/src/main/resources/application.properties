spring.application.name=reciclaje
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.database.initialize-support-schema=${APP_INITIALIZE_SUPPORT_SCHEMA:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap-admin.identifier=${BOOTSTRAP_ADMIN_IDENTIFIER:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
